<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Winter Arc">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Winter Arc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app, fixed bottom tab bar, cards only for habits/penalties */
:root{
  --bg:#0b1320; --surface:#121d2e; --surface2:#182740; --line:#24364f;
  --fg:#e9f0f8; --muted:#8597b0; --ice:#8fd3ff; --ice-ink:#062033;
  --ember:#ff7a45; --ember-soft:rgba(255,122,69,.14); --good:#6fe0a8; --good-soft:rgba(111,224,168,.13);
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{font-family:var(--display);font-weight:900;font-size:2.4rem;line-height:.9;letter-spacing:.01em;text-transform:uppercase}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:.72rem;letter-spacing:.14em;color:var(--muted);margin-top:6px}
.weekchip{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ice);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.banner{font-size:.85rem;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.banner b{color:var(--fg)}
h2{font-family:var(--display);font-weight:800;font-size:1.5rem;text-transform:uppercase;letter-spacing:.02em;margin:22px 0 10px;text-wrap:balance}
.label{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stack{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.habit-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.habit-name{font-weight:700;font-size:1.1rem}
.count{font-family:var(--display);font-weight:900;font-size:2.6rem;line-height:.85;font-variant-numeric:tabular-nums;white-space:nowrap}
.count span{color:var(--muted);font-weight:600;font-size:1.6rem}
.count.hit{color:var(--good)}
.bar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;background:var(--ice);border-radius:6px;transition:width .3s}
.bar.hit i{background:var(--good)}
.bar.ember i{background:var(--ember)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:grid;place-items:center;gap:2px;aspect-ratio:1/1.15;max-width:100%;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:.7rem;color:var(--muted);padding:0}
.day b{font-family:var(--display);font-size:1.15rem;color:var(--fg);font-weight:800}
.day.on{background:var(--ice);border-color:var(--ice);color:var(--ice-ink)}
.day.on b{color:var(--ice-ink)}
.day.today{border-color:var(--ice)}
.day:disabled{opacity:.35;cursor:default}
.day.on:disabled{opacity:1}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:.82rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;background:var(--surface2);color:var(--fg);font-size:.8rem;font-weight:600}
.pill.fire{color:#ffb07f}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--ember-soft);color:var(--ember)}
.pill svg{width:13px;height:13px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--ice);color:var(--ice-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.ember{background:var(--ember);color:#250b00}
.btn.small{padding:8px 12px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.grow{flex:1 1 120px;min-width:0}

/* penalty */
.penalty{border-color:var(--ember);background:linear-gradient(180deg,var(--ember-soft),transparent 70%),var(--surface)}
.penalty .big{font-family:var(--display);font-weight:900;font-size:4.2rem;line-height:.85;color:var(--ember);font-variant-numeric:tabular-nums}
.penalty .big span{font-size:2rem;color:var(--muted)}
.lockmsg{display:flex;gap:10px;align-items:center;font-weight:600;margin:4px 0 12px}
.lockmsg svg{flex:none;width:20px;height:20px;color:var(--ember)}
.locked .days{pointer-events:none;opacity:.35}

/* squad */
.person{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.4rem;background:var(--surface2);color:var(--ice);flex:none}
.person .nm{font-weight:700;font-size:1.15rem}
.mini{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mini .c{font-family:var(--display);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px;grid-column:1/-1}
.dots i{width:100%;height:5px;border-radius:3px;background:var(--surface2)}
.dots i.on{background:var(--ice)}
.tag{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}

/* NNN */
.nnn-hero{text-align:left;padding:22px 18px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 6px}
.cd div{background:var(--surface2);border-radius:12px;padding:10px 4px;text-align:center}
.cd b{display:block;font-family:var(--display);font-weight:900;font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
.cd span{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.quote{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1.05;text-transform:uppercase;text-wrap:balance;margin:10px 0 16px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.month button{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:transparent;font-family:var(--display);font-weight:800;font-size:1rem;color:var(--muted);padding:0}
.month button.ok{background:var(--good);border-color:var(--good);color:#06301c}
.month button.fail{background:var(--ember);border-color:var(--ember);color:#250b00}
.month button.today{border-color:var(--ice);color:var(--fg)}
.month button:disabled{cursor:default}
.rules{margin:0;padding-left:18px;color:var(--muted);font-size:.92rem;display:grid;gap:4px}
.rules b{color:var(--fg)}
.badge{display:flex;gap:14px;align-items:center}
.badge svg{width:64px;height:64px;flex:none}
.confirm{border:1px solid var(--ember);border-radius:12px;padding:12px;margin-top:10px;background:var(--ember-soft)}

/* settings */
.field{display:grid;gap:4px}
.field input,.field select{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--surface2);border:1px solid var(--line);transition:.2s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.2s}
.switch input:checked+i{background:var(--ice);border-color:var(--ice)}
.switch input:checked+i::after{left:23px;background:var(--ice-ink)}
.switch input:focus-visible+i{outline:2px solid var(--ice);outline-offset:2px}
.hedit{display:grid;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.hedit:first-of-type{border-top:0}
.hedit .g3{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.hedit .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hedit .g2>*,.hedit .g3>*{min-width:0}
.tots{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:8px}
.tots b{display:block;font-family:var(--display);font-weight:900;font-size:3rem;line-height:.9;color:var(--ember);font-variant-numeric:tabular-nums}
.tots span{font-size:.85rem;color:var(--muted);font-weight:600}
.muted{color:var(--muted);font-size:.88rem}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(11,19,32,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:10}
body.topnav .tabs{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding:6px 8px}
body.topnav .app{padding-block:14px 40px}
body.topnav .toast{position:sticky;display:block;width:max-content;margin:0 auto 16px;bottom:16px;left:auto;transform:none}
.tabs nav{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:520px}
.tab{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--ice)}
.tab .dot{position:absolute;top:4px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--ember)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
.onb{display:grid;gap:14px;padding-top:30px}
.prow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0;padding-top:0}
.tok{display:block;word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85rem;background:var(--surface2);border:1px solid var(--line);padding:10px 12px;border-radius:10px;user-select:all;-webkit-user-select:all}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="app" id="app"></div>
<div class="tabs"><nav id="tabs" role="tablist"></nav></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
// ---------- icons ----------
const I = {
  flame:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9v6M18 9v6M3 11v2M21 11v2M6 12h12"/></svg>',
  squad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M17 14.5c2.4 0 4 1.6 4.5 4.5"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>',
  me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
  badge:'<svg viewBox="0 0 64 64"><path d="M32 3l7 6 9-1 3 9 8 5-3 9 3 9-8 5-3 9-9-1-7 6-7-6-9 1-3-9-8-5 3-9-3-9 8-5 3-9 9 1z" fill="#6fe0a8"/><circle cx="32" cy="32" r="16" fill="#0b1320"/><text x="32" y="38" text-anchor="middle" font-family="Big Shoulders Display, Impact, sans-serif" font-weight="900" font-size="16" fill="#6fe0a8">NNN</text></svg>',
  badgeOff:'<svg viewBox="0 0 64 64"><path d="M32 3l7 6 9-1 3 9 8 5-3 9 3 9-8 5-3 9-9-1-7 6-7-6-9 1-3-9-8-5 3-9-3-9 8-5 3-9 9 1z" fill="none" stroke="#24364f" stroke-width="2"/><text x="32" y="38" text-anchor="middle" font-family="Big Shoulders Display, Impact, sans-serif" font-weight="900" font-size="16" fill="#24364f">NNN</text></svg>'
};
const QUOTES = [
 "Tag 1. Der Winter gehört dir.","Disziplin ist, wenn keiner zuschaut.","Kein Bock ist keine Ausrede.","Wer jetzt aufgibt, hat nie angefangen.",
 "Kalt draußen. Fokus drinnen.","Eine Woche durch. Weiter.","Dein Freund zählt auf dich.","Kleine Siege, jeden Tag.",
 "Der Kopf gibt zuerst auf. Nicht du.","Ein Drittel ist geschafft.","Komfort ist der Gegner.","Bleib langweilig. Bleib stark.",
 "Heute ist kein Tag für Ausnahmen.","Zwei Wochen. Spürst du es?","Halbzeit. Jetzt erst recht.","Energie in Training stecken.",
 "Du bist nicht wie vorher.","Ruhig bleiben, weitermachen.","Drei Wochen Charakter.","Lieber 500 Liegestütze vermeiden.",
 "Die letzten Meter zählen doppelt.","Niemand erinnert sich an Ausreden.","Jeder Tag ist eine Entscheidung.","Fast da. Nicht nachlassen.",
 "Der Arc zeigt sich im Spiegel.","Fünf Tage. Kopf aus, durchziehen.","Vier noch.","Drei noch. Stolz kommt bald.",
 "Morgen ist der letzte Tag.","Tag 30. Hol dir das Badge."];

// ---------- dates ----------
const pad = n => String(n).padStart(2,"0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (k,n) => { const d=parse(k); d.setDate(d.getDate()+n); return keyOf(d); };
const mondayOf = k => { const d=parse(k); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return keyOf(d); };
const weekDays = mon => Array.from({length:7},(_,i)=>addDays(mon,i));
const diffDays = (a,b) => Math.round((parse(b)-parse(a))/864e5);
const isoWeek = k => { const d=parse(k); d.setDate(d.getDate()+3-((d.getDay()+6)%7)); const w1=new Date(d.getFullYear(),0,4); return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7); };
const WD = ["Mo","Di","Mi","Do","Fr","Sa","So"];
const fmt = k => { const d=parse(k); return `${d.getDate()}.${d.getMonth()+1}.`; };

let simDate = null;
let realS = null; // real state kept aside while test mode runs
const today = () => simDate || keyOf(new Date());
const nowDate = () => { if(!simDate) return new Date(); const d=parse(simDate); const n=new Date(); d.setHours(n.getHours(),n.getMinutes(),n.getSeconds()); return d; };

// ---------- state ----------
const uid8 = () => Math.random().toString(36).slice(2,10);
function freshState(name, withDefaults=false){
  if (!withDefaults) return { v:1, name, createdAt: today(), habits:[], logs:{}, penalties:[],
    nnn:{joined:true, days:[], failedAt:null, punish:null}, share:{streak:true, penalties:true, nnn:true} };
  return { v:1, name, createdAt: today(),
    habits:[
      {id:"gym", name:"Gym", target:4, penalty:100, share:true, start: firstWeek(today())},
      {id:"kreatin", name:"Kreatin", target:7, penalty:100, share:true, start: firstWeek(today())}
    ],
    logs:{gym:[], kreatin:[]}, penalties:[],
    nnn:{joined:true, days:[], failedAt:null, punish:null},
    share:{streak:true, penalties:true, nnn:true} };
}
// a habit counts from the first full week (the week it was created only if created on a Monday)
function firstWeek(k){ const m=mondayOf(k); return m===k ? m : addDays(m,7); }

let S = null;           // private state
let mode = "local";     // "local" | "db" (Claude artifact) | "api" (Cloudflare)
let me = null;          // user id
let db = null;
let others = [];        // public docs of other players
let tab = "heute";
try { tab = localStorage.getItem("wa-tab") || "heute"; } catch(e){}
let ui = { nnnConfirm:false, delConfirm:null, exCustom:{}, numCustom:{}, showToken:false, logoutConfirm:false, pConfirm:null, leaveConfirm:false };

// ---------- logic ----------
const logsOf = h => S.logs[h.id] || (S.logs[h.id]=[]);
const countIn = (h, mon) => { const set=new Set(weekDays(mon)); return logsOf(h).filter(k=>set.has(k)).length; };
function weekStreak(h){
  const cur = mondayOf(today()); let n = countIn(h,cur)>=h.target ? 1 : 0;
  let w = addDays(cur,-7);
  while (w >= h.start && countIn(h,w) >= h.target) { n++; w = addDays(w,-7); }
  return n;
}
function dayStreak(h){
  const set = new Set(logsOf(h)); let d = today(); if(!set.has(d)) d = addDays(d,-1);
  let n=0; while(set.has(d)){ n++; d=addDays(d,-1); } return n;
}
const openPenalty = () => S.penalties.find(p => p.done < p.reps);
const nnnPunishSum = () => { const P=S.nnn.punish; return P ? Object.values(P.log).reduce((a,b)=>a+b,0) : 0; };
const EX_PRESETS = ["Liegestütze","Sit-ups"];
const NUM_PRESETS = [25,50,100,150,200,300];
const exOf = x => (x && x.exercise) || "Liegestütze";
function exerciseTotals(){
  const t = {};
  for (const p of S.penalties){ if(p.done) t[exOf(p)] = (t[exOf(p)]||0) + p.done; }
  const nnn = (S.nnn.archived||0) + nnnPunishSum();
  if (nnn) t["Liegestütze"] = (t["Liegestütze"]||0) + nnn;
  return t;
}
function pushupStats(){
  const t = exerciseTotals();
  return { totals:t, nnn:(S.nnn.archived||0)+nnnPunishSum(), done: S.penalties.filter(p=>!p.passed && p.done>=p.reps).length };
}

function evaluate(){
  let changed = false; const cur = mondayOf(today());
  for (const h of S.habits){
    for (let w=h.start; w<cur; w=addDays(w,7)){
      if (S.penalties.some(p=>p.habitId===h.id && p.week===w)) continue;
      const c = countIn(h,w);
      if (c < h.target){
        S.penalties.push({id:uid8(), habitId:h.id, habitName:h.name, week:w, count:c, target:h.target, reps:h.penalty, exercise:exOf(h), done:0});
      } else {
        S.penalties.push({id:uid8(), habitId:h.id, habitName:h.name, week:w, count:c, target:h.target, reps:0, done:0, passed:true});
      }
      changed = true;
    }
  }
  // NNN punishment deadlines
  const P = S.nnn.punish;
  if (P && P.status==="open"){
    const end = addDays(P.start, P.days-1);
    const sum = Object.values(P.log).reduce((a,b)=>a+b,0);
    if (sum >= P.total){ P.status="done"; changed=true; }
    else if (today() > end){
      if (P.stage===1){ S.nnn.archived = (S.nnn.archived||0) + sum; S.nnn.punish = {stage:2, start:today(), total:1000, days:10, log:{}, status:"open"}; }
      else { P.status="lost"; }
      changed = true;
    }
  }
  return changed;
}
function nnnPhase(){
  const t = today(); const y = parse(t).getFullYear();
  const start = `${y}-11-01`, end = `${y}-11-30`;
  if (t < start) return {phase:"wait", start, end, year:y};
  if (t <= end) return {phase:"live", start, end, year:y, day: diffDays(start,t)+1};
  return {phase:"over", start, end, year:y};
}
function nnnStatus(){
  const ph = nnnPhase(); const n = S.nnn;
  if (!n.joined) return {key:"out", text:"Nicht dabei"};
  if (n.failedAt && n.failedAt.slice(0,4)==String(ph.year)) return {key:"failed", text:"Verkackt am "+fmt(n.failedAt)};
  if (ph.phase==="wait") return {key:"wait", text:"Startet am 1.11."};
  const confirmed = n.days.filter(k=>k.startsWith(ph.year+"-11")).length;
  if (ph.phase==="live") return {key:"live", text:`Tag ${ph.day}/30 · ${confirmed} bestätigt`, confirmed};
  return confirmed>=30 ? {key:"badge", text:"Geschafft · Badge"} : {key:"incomplete", text:`${confirmed}/30 bestätigt`};
}

function publicView(){
  const cur = mondayOf(today());
  const pv = { name:S.name, updated: Date.now(), week: cur, habits:[] };
  for (const h of S.habits){
    if (!h.share) continue;
    const days = weekDays(cur).map(k=>logsOf(h).includes(k));
    const o = { name:h.name, target:h.target, count:countIn(h,cur), days };
    if (S.share.streak){ o.weekStreak = weekStreak(h); if(h.target===7) o.dayStreak = dayStreak(h); }
    pv.habits.push(o);
  }
  if (S.share.penalties){
    const p = openPenalty();
    pv.penalty = p ? {habit:p.habitName, reps:p.reps, done:p.done, exercise:exOf(p)} : null;
    pv.penaltiesDone = S.penalties.filter(p=>!p.passed && p.done>=p.reps).length;
    pv.totals = exerciseTotals();
    const NP = S.nnn.punish; pv.nnnPunish = NP && NP.status==="open" ? {total:NP.total, done:Object.values(NP.log).reduce((a,b)=>a+b,0), stage:NP.stage} : null;
  }
  if (S.share.nnn) pv.nnn = nnnStatus();
  return pv;
}

let token = null; try { token = localStorage.getItem("wa-token"); } catch(e){}
async function api(method, path, body, tok = token){
  const r = await fetch(path, { method, cache:"no-store", headers: { "content-type":"application/json", ...(tok ? {authorization:"Bearer "+tok} : {}) }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(()=>({}));
  if (!r.ok){ const e = new Error(d.error || r.statusText); e.status = r.status; throw e; }
  return d;
}
const toB64 = u8 => { let s=""; for (let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(s); };
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function encKey(){ const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("wa-enc:"+token)); return crypto.subtle.importKey("raw", h, "AES-GCM", false, ["encrypt","decrypt"]); }
async function encrypt(str){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, await encKey(), new TextEncoder().encode(str)));
  const all = new Uint8Array(12+ct.length); all.set(iv); all.set(ct,12); return toB64(all);
}
async function decrypt(b64){
  const all = fromB64(b64);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv: all.slice(0,12)}, await encKey(), all.slice(12));
  return new TextDecoder().decode(pt);
}
function setToken(t){ token = t; try { t ? localStorage.setItem("wa-token", t) : localStorage.removeItem("wa-token"); } catch(e){} }

async function loadMine(){

    const daysLeft = Math.max(1, diffDays(today(), end)+1); const perDay = Math.ceil(Math.max(0,P.total-sum)/daysLeft);
    pun = `<h2>NNN-Strafe</h2><div class="card penalty">
      <div class="label">Stufe ${P.stage} · ${P.total} in ${P.days} Tagen · ${fmt(P.start)} bis ${fmt(end)}</div>

      <div class="row"><button class="btn ember grow" data-np="10">+10</button><button class="btn ember grow" data-np="25">+25</button><button class="btn ember grow" data-np="50">+50</button><button class="btn ghost grow" data-np="-10">−10</button></div>
      ${P.stage===1?'<p class="muted" style="margin-bottom:0">Nicht geschafft bis zum Ende? Dann 1000 in 10 Tagen.</p>':""}`
      : P.status==="done"?'<div class="pill good" style="margin-top:8px">Abgearbeitet</div>':'<div class="pill bad" style="margin-top:8px">Auch Stufe 2 nicht geschafft</div>'}
    </div>`;
  }
  app.innerHTML = header("No Nut November") + `<div class="stack">${body}</div>${pun}
    <h2>Badge</h2><div class="card badge">${st.key==="badge"?I.badge:I.badgeOff}<div><b>NNN ${ph.year}</b><div class="muted">${st.key==="badge"?"Freigeschaltet. Sieht dein Freund, wenn du NNN teilst.":"30 Tage bestätigen, nicht verkacken."}</div></div></div>
    <h2>Regeln</h2><ol class="rules">
      <li>Vom <b>1. bis 30. November</b> jeden Tag bestätigen.</li>
      <li>Jeden Tag gibt's einen neuen Spruch.</li>
      <li>Verkackt: <b>500 Liegestütze in 3 Tagen</b>.</li>
      <li>Nicht geschafft: <b>1000 in 10 Tagen</b>.</li>
      <li>30 von 30 bestätigt: <b>Badge</b>.</li></ol>
    <div class="card" style="margin-top:16px"><div class="toggle"><span>Ich mache mit</span><label class="switch"><input type="checkbox" id="nnnJoin" ${n.joined?"checked":""}><i></i></label></div></div>`;
  clearInterval(cdTimer);
  if (ph.phase==="wait"){
    const target = new Date(ph.year,10,1,0,0,0);
    const tick = () => { const el=document.getElementById("cd"); if(!el) return clearInterval(cdTimer);
      let s = Math.max(0, Math.floor((target - nowDate())/1000));
      const d=Math.floor(s/86400); s%=86400; const h=Math.floor(s/3600); s%=3600; const m=Math.floor(s/60); s%=60;
      el.innerHTML = [[d,"Tage"],[h,"Std"],[m,"Min"],[s,"Sek"]].map(([v,l])=>`<div><b>${pad(v)}</b><span>${l}</span></div>`).join(""); };
    tick(); cdTimer = setInterval(tick,1000);
  }
}
function monthGrid(ph){
  const n = S.nnn; const t = today(); let html = '<div class="month">';
  const lead = (parse(ph.start).getDay()+6)%7; for(let i=0;i<lead;i++) html+='<span></span>';
  for (let d=1; d<=30; d++){
    const k = `${ph.year}-11-${pad(d)}`; const ok = n.days.includes(k); const fail = n.failedAt===k;
    const canTap = n.joined && !n.failedAt && k<=t && !ok && ph.phase==="live";
    html += `<button class="${ok?"ok":""} ${fail?"fail":""} ${k===t?"today":""}" ${canTap?`data-nday="${k}"`:"disabled"} aria-label="${d}. November${ok?" bestätigt":""}">${d}</button>`;
  }
  return html + '</div><p class="muted" style="margin-bottom:0">Vergessen zu bestätigen? Tipp auf den Tag.</p>';
}

document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if(!b) return; tab = b.dataset.tab; try{localStorage.setItem("wa-tab",tab)}catch(e){} ui.nnnConfirm=false; render(); window.scrollTo(0,0);

app.addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t) return;
  if (t.dataset.claim) return doClaim(t.dataset.claim);
  if (t.id==="onbLogin") return doLogin();
  if (t.id==="reloadSlots") return location.reload();
  if (!S) return;
  if (t.id==="showTok"){ ui.showToken=true; return render(); }
  if (t.id==="hideTok"){ ui.showToken=false; return render(); }
  if (t.id==="copyTok"){
    const done = () => toast("Code kopiert.");
    const fallback = () => { const el=document.getElementById("tokText"); const rg=document.createRange(); rg.selectNodeContents(el); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(rg); toast("Code markiert. Jetzt kopieren."); };
    try { navigator.clipboard.writeText(token).then(done, fallback); } catch(_){ fallback(); }
    return;
  }
  if (t.id==="logout"){ ui.logoutConfirm=true; return render(); }
  if (t.id==="logoutNo"){ ui.logoutConfirm=false; return render(); }
  if (t.dataset.prm){ ui.pConfirm={id:t.dataset.prm, kind:"rm"}; return render(); }
  if (t.dataset.preset){ ui.pConfirm={id:t.dataset.preset, kind:"reset"}; return render(); }
  if (t.hasAttribute("data-pno")){ ui.pConfirm=null; return render(); }
  if (t.dataset.pyes){
    const {id, kind} = ui.pConfirm || {}; ui.pConfirm=null;
    (async()=>{ try { kind==="rm" ? await api("DELETE","/api/admin/players/"+id) : await api("POST","/api/admin/players/"+id+"/reset"); toast(kind==="rm"?"Entfernt.":"Zurückgesetzt. Platz ist wieder frei."); await poll(); render(); } catch(e){ toast(e.message || "Hat nicht geklappt."); } })();
    return;
  }
  if (t.id==="addP"){
    const name = document.getElementById("newP").value.trim(); if(!name) return toast("Gib einen Namen ein.");
    (async()=>{ try { await api("POST","/api/admin/players",{name}); toast(name+" hinzugefügt. Schick den Link."); await poll(); render(); } catch(e){ toast(e.message || "Hat nicht geklappt."); } })();
    return;
  }
  if (t.id==="leave"){ ui.leaveConfirm=true; return render(); }
  if (t.id==="leaveNo"){ ui.leaveConfirm=false; return render(); }
  if (t.id==="leaveYes"){
    ui.leaveConfirm=false;
    (async()=>{ try { await api("POST","/api/leave"); setToken(null); try{localStorage.removeItem("wa-cache")}catch(_){} S=null; me=null; others=[]; clearInterval(pollT); toast("Du bist ausgetreten."); bootApi(); } catch(e){ toast(e.message || "Hat nicht geklappt."); } })();
    return;
  }
  if (t.id==="logoutYes"){ ui.logoutConfirm=false; ui.showToken=false; setToken(null); try{localStorage.removeItem("wa-cache")}catch(_){} S=null; me=null; others=[]; clearInterval(pollT); bootApi(); return; }
  if (t.dataset.tab){ tab=t.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (t.dataset.suggest){
    const id = uid8(); S.habits.push({id, name:t.dataset.suggest, target:Number(t.dataset.t), penalty:100, share:true, start:firstWeek(today())}); S.logs[id]=[];
    toast(`${t.dataset.suggest} hinzugefügt.`); return commit();
  }
  if (t.dataset.log){
    if (openPenalty()) return toast("Erst die Strafe abarbeiten.");
    const h = S.habits.find(x=>x.id===t.dataset.log); const arr = logsOf(h); const k=t.dataset.day;
    const i = arr.indexOf(k); if(i>=0) arr.splice(i,1); else arr.push(k);
    const c = countIn(h, mondayOf(today()));
    if (i<0 && c===h.target) toast(`${h.name}: Wochenziel geschafft.`);
    return commit();
  }
  if (t.dataset.pen){
    const p = openPenalty(); if(!p) return;
    p.done = Math.max(0, Math.min(p.reps, p.done + Number(t.dataset.pen)));
    if (p.done>=p.reps){ p.doneAt = today(); toast("Strafe abgearbeitet. Weiter geht's."); }
    return commit();
  }
  if (t.dataset.np){
    const P = S.nnn.punish; if(!P||P.status!=="open") return;
    const k=today(); P.log[k] = Math.max(0,(P.log[k]||0)+Number(t.dataset.np));
    const sum = Object.values(P.log).reduce((a,b)=>a+b,0);
    if (sum>=P.total){ P.status="done"; toast("NNN-Strafe abgearbeitet."); }
    return commit();
  }
  if (t.id==="nnnOk"){ if(!S.nnn.days.includes(today())) S.nnn.days.push(today()); toast("Tag bestätigt."); return commit(); }
  if (t.dataset.nday){ if(!S.nnn.days.includes(t.dataset.nday)) S.nnn.days.push(t.dataset.nday); return commit(); }
  if (t.id==="nnnFail"){ ui.nnnConfirm=true; return render(); }
  if (t.id==="nnnFailNo"){ ui.nnnConfirm=false; return render(); }
  if (t.id==="nnnFailYes"){ ui.nnnConfirm=false; S.nnn.failedAt=today(); S.nnn.punish={stage:1,start:today(),total:500,days:3,log:{},status:"open"}; return commit(); }
  if (t.dataset.del){ ui.delConfirm=t.dataset.del; return render(); }
  if (t.hasAttribute("data-delno")){ ui.delConfirm=null; return render(); }
  if (t.dataset.delyes){ const id=t.dataset.delyes; S.habits=S.habits.filter(h=>h.id!==id); S.penalties=S.penalties.filter(p=>p.habitId!==id||p.done>=p.reps); ui.delConfirm=null; return commit(); }
  if (t.id==="addH"){
    const name = document.getElementById("newH").value.trim(); if(!name) return toast("Gib der Gewohnheit einen Namen.");
    const id = uid8(); S.habits.push({id,name,target:Number(document.getElementById("newT").value),penalty:100,share:true,start:firstWeek(today())}); S.logs[id]=[];
    toast(`${name} hinzugefügt.`); return commit();
  }
  if (t.dataset.simgo){ return goSim(t.dataset.simgo); }
  if (t.id==="simGo"){ const m=document.getElementById("simM").value; let d=Number(document.getElementById("simD").value);
    const [yy,mm]=m.split("-").map(Number); const last=new Date(yy,mm,0).getDate(); if(d>last) d=last; return goSim(`${m}-${pad(d)}`); }
  if (t.id==="simReset"){ simDate=null; if(realS){ S=realS; realS=null; } ui.nnnConfirm=false; toast("Test beendet. Echte Daten zurück."); render(); return; }
});
app.addEventListener("change", e => {
  const el = e.target; if(!S) return;
  if (el.id==="nm"){ S.name = el.value.trim()||S.name; return commit(); }
  if (el.dataset.hf){
    const h = S.habits.find(x=>x.id===el.dataset.h); const f = el.dataset.hf;
    if (f==="exsel"){ if(el.value==="__own"){ ui.exCustom[h.id]=true; return render(); } ui.exCustom[h.id]=false; h.exercise=el.value; return commit(); }
    if (f==="numsel"){ if(el.value==="__own"){ ui.numCustom[h.id]=true; return render(); } ui.numCustom[h.id]=false; h.penalty=Number(el.value); return commit(); }
    if (f==="exercise"){ const v=el.value.trim(); if(v) h.exercise=v; return commit(); }
    if (f==="penalty"){ const n=Math.round(Number(el.value)); if(n>=1 && n<=5000) h.penalty=n; else toast("Gib eine Zahl zwischen 1 und 5000 ein."); return commit(); }
    h[f] = f==="share" ? el.checked : f==="name" ? (el.value.trim()||h.name) : Number(el.value);
    return commit();
  }
  if (el.dataset.share){ S.share[el.dataset.share]=el.checked; return commit(); }
  if (el.id==="nnnJoin"){ S.nnn.joined = el.checked; return commit(); }
});

// ---------- boot ----------
function bootLocal(){
  mode = "local";
  let s = null; try{ s = JSON.parse(localStorage.getItem("wa-state")); }catch(e){}
  S = s || seedLocal(); evaluate(); others = []; render();
}
// Inside the Claude viewer a fixed bottom bar can end up out of sight, so the menu sits at the top there.
let framed = true; try { framed = window.self !== window.top; } catch(e){}
if (framed){ document.body.classList.add("topnav"); const tb=document.querySelector(".tabs"); document.body.insertBefore(tb, app); }
async function tryClaudeDb(){
  try {
    if (!window.claude || !window.claude.use) return;
    const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!d || !u) return;
    const id = await u.id(); if (!id) return;
    db = d; me = id;
    const snap = await db.collection("data/users/"+me).doc("state").get();
    mode = "db";
    db.collection("players").onSnapshot(qs => {
      others = qs.docs.filter(x=>x.id!==me && x.exists).map(x=>({id:x.id, ...x.data()}));
      if (S && tab==="squad") render();
    }, () => {});
    if (snap.exists){ S = JSON.parse(JSON.stringify(snap.data())); if(evaluate()) save(); render(); }
    else { S = null; renderOnboarding(); }
  } catch(e){ /* stay in preview mode */ }
}

(async () => {
  if (!framed && /^https?:$/.test(location.protocol)){
    app.innerHTML = '<div class="onb"><div class="brand" style="font-size:3.4rem">Winter<br>Arc<small>Lädt …</small></div></div>';
    if (await bootApi()) return;
  }
  bootLocal();
  tryClaudeDb();
})();
})();
